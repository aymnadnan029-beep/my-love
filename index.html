<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>محكمة الحب ❤️</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <div class="container">


        <h1>⚖️ محكمة الحب</h1>


        <button id="start">
            ابدأ المحاكمة ❤️
        </button>



        <div id="court" class="hidden">

            <p id="text"></p>

        </div>



        <div id="choices" style="display:none;">


            <button id="forgive">
                أسامحك ❤️
            </button>


            <button id="no">
                لسه زعلانة 😢
            </button>


        </div>



        <div id="final" style="display:none;">

            <h2>
                تم الحكم بالحب ❤️
            </h2>

            <p>
                شكراً لأنك سامحتيني يا رويدا،
                وجودك أجمل شيء في حياتي ❤️
            </p>

        </div>


    </div>



<script src="script.js"></script>


</body>

</html>

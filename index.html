<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🌸 صباح الخير يا رويدا 🌸</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,sans-serif;
}

body{

height:100vh;
overflow:hidden;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(180deg,#6ec6ff,#b3e5fc,#fff8e1);

}

.cloud{

position:absolute;
background:white;
border-radius:50px;
opacity:.8;

}

.cloud::before{

content:"";
position:absolute;
width:60px;
height:60px;
background:white;
border-radius:50%;
left:10px;
top:-20px;

}

.cloud::after{

content:"";
position:absolute;
width:70px;
height:70px;
background:white;
border-radius:50%;
right:10px;
top:-30px;

}

.c1{

width:180px;
height:60px;
top:70px;
left:-220px;
animation:moveCloud 35s linear infinite;

}

.c2{

width:220px;
height:70px;
top:180px;
left:-250px;
animation:moveCloud 45s linear infinite;

}

@keyframes moveCloud{

from{

transform:translateX(0);

}

to{

transform:translateX(calc(100vw + 450px));

}

}

.box{

position:relative;
z-index:5;
width:90%;
max-width:500px;
padding:35px;
background:rgba(255,255,255,.75);
backdrop-filter:blur(12px);
border-radius:25px;
text-align:center;
box-shadow:0 10px 30px rgba(0,0,0,.15);

}

h1{

color:#ff5c8a;
margin-bottom:20px;

}

p{

font-size:20px;
line-height:1.8;
color:#444;

}

button{

margin-top:25px;
padding:16px 35px;
border:none;
border-radius:15px;
background:#ff5c8a;
color:white;
font-size:18px;
cursor:pointer;
transition:.3s;

}

button:hover{

transform:scale(1.05);

}

.hidden{

display:none;

}

#count{

font-size:70px;
font-weight:bold;
color:#ff5c8a;

}

#message{

margin-top:20px;
font-size:22px;
line-height:2;
white-space:pre-wrap;
text-align:right;

}

</style>

</head>

<body>

<div class="cloud c1"></div>

<div class="cloud c2"></div>

<div class="box">

<div id="start">

<h1>🌸 صباح الخير يا رويدا 🌸</h1>

<p>

قبل ما يبدأ يومك...

في رسالة صغيرة كتبتها من كل قلبي إلك ❤️

</p>

<button onclick="startMessage()">

💌 افتحي الرسالة

</button>

</div>

<div id="counterBox" class="hidden">

<div id="count">3</div>

<p>استعدي... ❤️</p>

</div>

<div id="message" class="hidden"></div>

<script>

<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>محكمة الحب ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{

background:linear-gradient(135deg,#0d1117,#161b22,#1f2937);

height:100vh;

overflow:hidden;

display:flex;

justify-content:center;

align-items:center;

color:white;

}

.container{

width:90%;

max-width:800px;

background:rgba(255,255,255,.06);

border:1px solid rgba(255,255,255,.1);

backdrop-filter:blur(15px);

border-radius:25px;

padding:40px;

text-align:center;

box-shadow:0 0 40px rgba(0,0,0,.5);

animation:fade 2s;

}

h1{

font-size:45px;

color:#ffd54f;

margin-bottom:15px;

}

h2{

font-size:26px;

margin-bottom:25px;

color:#ddd;

}

p{

font-size:22px;

line-height:2;

color:#eee;

}

button{

margin-top:35px;

padding:15px 40px;

font-size:22px;

border:none;

border-radius:50px;

cursor:pointer;

background:#ff4d6d;

color:white;

transition:.3s;

}

button:hover{

transform:scale(1.07);

background:#ff6f91;

}

.hidden{

display:none;

}

#court{

margin-top:35px;

text-align:right;

font-size:22px;

line-height:2.2;

min-height:250px;

}

.type{

border-left:3px solid white;

padding-left:10px;

white-space:pre-wrap;

}

@keyframes fade{

from{

opacity:0;

transform:translateY(40px);

}

to{

opacity:1;

transform:translateY(0);

}

}

.gavel{

font-size:90px;

animation:bounce 2s infinite;

}

@keyframes bounce{

0%,100%{

transform:translateY(0);

}

50%{

transform:translateY(-12px);

}

}

#choices{

margin-top:40px;

display:none;

justify-content:center;

gap:25px;

flex-wrap:wrap;

}

#forgive{

background:#2ecc71;

}

#forgive:hover{

background:#4be18b;

}

#no{

background:#e74c3c;

position:relative;

}

#final{

display:none;

margin-top:30px;

font-size:24px;

line-height:2;

animation:fade 2s;

color:#ffe082;

}

.heart{

position:absolute;

color:#ff4d6d;

animation:fall linear forwards;

pointer-events:none;

}

@keyframes fall{

0%{

transform:translateY(-100px);

opacity:1;

}

100%{

transform:translateY(110vh);

opacity:0;

}

}

</style>

</head>

<body>

<div class="container">

<div class="gavel">⚖️</div>

<h1>محكمة الحب</h1>

<h2>القضية رقم #001</h2>

<p>

المتهم: أيمن

<br>

التهمة: التسبب في حزن رويدا...

</p>

<button id="start">

بدء المحاكمة

</button>

<div id="court" class="hidden">

<div class="type" id="text"></div>

</div>

<div id="choices">

<button id="forgive">

❤️ أسامحك

</button>

<button id="no">

💔 لسه زعلانة

</button>

</div>

<div id="final">

شكراً لأن قلبك أكبر من خطئي...

<br><br>

وعد مني...

راح أحاول كل يوم أخليك تبتسمي أكثر مما زعلتك.

<br><br>

أحبك يا رويدا ❤️

</div>

</div>

<script src="script.js"></script>

</body>

</html>

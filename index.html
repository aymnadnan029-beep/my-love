<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>☕ رسالة الصباح</title>

<style>
body{
margin:0;
font-family:Tahoma;
background:#f8f3eb;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
text-align:center;
}

.box{
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 0 20px rgba(0,0,0,.15);
width:90%;
max-width:420px;
}

button{
padding:15px 30px;
font-size:18px;
background:#8B5E3C;
color:white;
border:none;
border-radius:12px;
cursor:pointer;
}

#msg{
display:none;
margin-top:20px;
font-size:20px;
line-height:1.8;
color:#444;
}
</style>

</head>

<body>

<div class="box">

<h1>☕ صباح الخير يا رويدا</h1>

<p>حضرتلك رسالة مع أول قهوة بهاليوم ❤️</p>

<button onclick="showMessage()">
اضغطي على فنجان القهوة ☕
</button>

<div id="msg">
🌸 صباح الخير يا حبيبتي رويدا 🌸<br><br>

جمعة مباركة يا عمري ❤️<br><br>

الله يحفظك ويطمن قلبك ويكتب لك الخير وين ما كنتِ.<br><br>

أتمنى يكون يومك مليان راحة وابتسامة وسعادة.<br><br>

بحبك كتير...<br>
بعشقك وبعبدك. ❤️<br><br>

الله ما يحرمني منك يا أجمل نعمة بحياتي. 🤍
</div>

</div>

<script>

function showMessage(){

document.getElementById("msg").style.display="block";

}

</script>

</body>
</html>

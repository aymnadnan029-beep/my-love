<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إليكِ ❤️</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Tahoma,sans-serif;
}

body{
background:linear-gradient(135deg,#ff9ecf,#ffd6e8,#fff);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

.card{
width:90%;
max-width:700px;
background:rgba(255,255,255,.9);
padding:35px;
border-radius:25px;
text-align:center;
box-shadow:0 15px 40px rgba(0,0,0,.2);
animation:show 1s;
}

@keyframes show{
from{opacity:0;transform:scale(.8);}
to{opacity:1;transform:scale(1);}
}

h1{
color:#ff2d75;
margin-bottom:20px;
font-size:34px;
}

#text{
font-size:22px;
line-height:2;
color:#444;
white-space:pre-line;
}

.heart{
position:absolute;
color:#ff4f87;
font-size:20px;
animation:fall linear infinite;
}

@keyframes fall{
0%{
transform:translateY(-10vh);
opacity:1;
}
100%{
transform:translateY(110vh);
opacity:0;
}
}
</style>

</head>
<body>

<div class="card">
<h1>💖 إلى حبيبتي رويدا 💖</h1>

<div id="text"></div>

</div>

<script>

const message=`

إذا وصلتي لهون...
فهذا لأنكِ أغلى إنسانة بحياتي ❤️

اشتقتلك كتير...
وأنا آسف إذا زعلتك.

ما مرّت لحظة إلا وأنا بفكر فيكي.

بحبك...
وبعبدك...

وأنتِ أجمل شي صار بحياتي.

سامحيني،
وخلينا نرجع نضحك متل قبل.

أنا ناطر رسالة منك...
حتى لو كانت كلمة وحدة ❤️

`;

let i=0;

function type(){

if(i<message.length){

document.getElementById("text").innerHTML+=message.charAt(i);

i++;

setTimeout(type,55);

}

}

type();

function createHeart(){

const heart=document.createElement("div");

heart.className="heart";

heart.innerHTML="❤️";

heart.style.left=Math.random()*100+"vw";

heart.style.fontSize=(15+Math.random()*25)+"px";

heart.style.animationDuration=(4+Math.random()*4)+"s";

document.body.appendChild(heart);

setTimeout(()=>heart.remove(),8000);

}

setInterval(createHeart,250);

</script>

</body>
</html>
